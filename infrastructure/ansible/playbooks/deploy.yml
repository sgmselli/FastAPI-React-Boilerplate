---
- name: pull images from registry and run docker compose
  hosts: vm01
  become: yes
  tasks:
    - name: Ensure project directory exists
      file:
        path: /root
        state: directory
        mode: '0755'

    - name: Copy docker-compose file
      copy:
        src: ../../../compose/docker-compose.production.yml
        dest: /root/docker-compose.yml
    
    - name: Log in to DigitalOcean registry
      community.docker.docker_login:
        registry_url: registry.digitalocean.com
        username: doctl
        password: "{{ lookup('env','DIGITALOCEAN_ACCESS_TOKEN') }}"

    - name: Pull images
      community.docker.docker_compose_v2_pull:
        project_src: /root/

    # Runs once, before any new code starts, so a failed migration stops the deploy
    - name: Run database migrations
      ansible.builtin.command:
        cmd: docker compose run --rm backend alembic -c app/db/migrations/alembic.ini upgrade head
        chdir: /root/
      register: migrations
      changed_when: "'Running upgrade' in migrations.stderr"

    - name: Start containers
      community.docker.docker_compose_v2:
        project_src: /root/