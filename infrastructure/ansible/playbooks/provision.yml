---
- name: Provision VM with dependency and Docker installations
  hosts: vm01
  become: yes
  tasks:

    - name: Update apt and upgrade packages
      apt:
        update_cache: yes
        upgrade: dist
        force_apt_get: yes

    - name: Install dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - software-properties-common
        state: present

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        update_cache: yes

    - name: Install Docker Engine and CLI
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin      
          - docker-compose-plugin
        state: latest
        update_cache: yes

    - name: Ensure docker service is running
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Verify Docker version
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Verify Docker Compose version
      command: docker compose version
      register: compose_version
      changed_when: false

    - name: Ensure Docker CLI plugins directory exists
      file:
        path: /root/.docker/cli-plugins
        state: directory
        mode: '0755'

    - name: Install docker-rollout
      get_url:
        url: https://raw.githubusercontent.com/wowu/docker-rollout/v0.14/docker-rollout
        dest: /root/.docker/cli-plugins/docker-rollout
        checksum: sha256:cdeaba6ae9eee3b0b606286e585bbda6787283d801a6ad6d9b9d2bc347fda05b
        mode: '0755'