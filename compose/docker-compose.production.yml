services:
  reverse-proxy:
    container_name: reverse-proxy
    image: registry.digitalocean.com/fastapi-react-cr/app:reverse-proxy-latest
    volumes:
      - ./certbot/www/:/var/www/certbot/:ro
      - ./certbot/conf/:/etc/letsencrypt/:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - backend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw
      - ./certbot/conf/:/etc/letsencrypt/:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

  backend:
    container_name: backend
    image: registry.digitalocean.com/fastapi-react-cr/app:backend-latest
    env_file:
      - .env.backend
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  db:
    container_name: db
    image: postgres:18
    volumes:
      # postgres:18 declares VOLUME /var/lib/postgresql (PGDATA is
      # /var/lib/postgresql/18/docker) - mount the parent, not data/ as on 17.
      - db_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    env_file:
      - .env.db
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    container_name: worker
    image: registry.digitalocean.com/fastapi-react-cr/app:backend-latest
    env_file:
      - .env.backend
    command: celery -A app.celery.task_queue.celery_task_queue worker --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:

networks:
  backend:
    driver: bridge