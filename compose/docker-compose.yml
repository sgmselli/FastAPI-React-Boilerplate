services:

  frontend:
    container_name: frontend
    build:
      context: ../frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://backend:8000

  backend:
    container_name: backend
    build:
      context: ../backend
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    container_name: db
    image: postgres:18
    volumes:
      - /var/lib/postgresql
      # Creates boilerplatetestdb + testdbadmin on first init. Only runs when
      # the data directory is empty - see documentation/automated-testing.md.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=boilerplatedb
      - POSTGRES_USER=dbadmin
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=db

  worker:
    build:
      context: ../backend
    command: celery -A app.celery.task_queue.celery_task_queue worker --loglevel=info
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  db_data: