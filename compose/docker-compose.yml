services:

  frontend:
    container_name: frontend
    build:
      context: ../frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://reverse_proxy:80
    depends_on:
      - reverse_proxy

  reverse_proxy:
    container_name: reverse_proxy
    build:
      context: ../reverse_proxy/development
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    container_name: backend
    build:
      context: ../backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV
    depends_on:
      db:
        condition: service_healthy

  db:
    container_name: db
    image: postgres:18
    volumes:
      - /var/lib/postgresql
      # Creates boilerplatetestdb + testdbadmin on first init. Only runs when
      # the data directory is empty - see documentation/automated-testing.md.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=boilerplatedb
      - POSTGRES_USER=dbadmin
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ../backend
    command: celery -A app.celery.task_queue.celery_task_queue worker --loglevel=info
    environment:
      - APP_ENV
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 3s
        retries: 10

volumes:
  db_data: