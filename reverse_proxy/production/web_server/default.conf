# Rate limiting 20 per second per IP, shared across all API endpoints
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# Endpoints with stricter limits
map $uri $rate_limit_group {
    default                          "";
    /api/v1/auth/login               auth;
    /api/v1/user/register            auth;
    ~^/api/v1/auth/password-reset/   auth;
    ~^/api/v1/auth/otp/              auth;
    /api/v1/profile/current/picture  upload;
}

# Empty key means the request isn't counted against that zone
map $rate_limit_group $auth_limit_key {
    auth     $binary_remote_addr$uri;
    default  "";
}

map $rate_limit_group $upload_limit_key {
    upload   $binary_remote_addr;
    default  "";
}

# Rate limiting for auth endpoints 5 per minute
limit_req_zone $auth_limit_key zone=auth_limit:10m rate=5r/m;

# Rate limiting for profile picture uploads 10 per minute
limit_req_zone $upload_limit_key zone=upload_limit:10m rate=10r/m;

# Concurrent connections per IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Return code 429 for too many requests
limit_req_status 429;
limit_conn_status 429;

# Drop slow clients holding connections open (time between reads, not total)
client_header_timeout 10s;
client_body_timeout 10s;

server_tokens off;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_tickets off;

# Drop requests that don't target our domain
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    access_log off;
    return 444;
}

server {
    listen 80;
    server_name api.fastapireactboilerplate.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.fastapireactboilerplate.com;

    ssl_certificate /etc/letsencrypt/live/api.fastapireactboilerplate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fastapireactboilerplate.com/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ~ ^/api/(?<api_path>.*)$ {
        limit_req zone=api_limit burst=40 nodelay;
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req zone=upload_limit burst=5 nodelay;
        limit_conn conn_limit 20;

        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/api/$api_path$is_args$args;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Every other endpoint keeps nginx's 1MB default, this keeps at 6MB
        location ~ ^/api/v1/profile/current/picture$ {
            # Profile pictures are capped at 5MB by the backend,
            # plus headroom for the multipart encoding around the file
            client_max_body_size 6m;

            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream/api/v1/profile/current/picture$is_args$args;
        }
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
