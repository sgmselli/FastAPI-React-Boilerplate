limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name api.fastapireactboilerplate.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# The initial cert for this domain was bootstrapped by commenting this
# block out (nginx won't start if ssl_certificate/ssl_certificate_key point
# at files that don't exist, and certbot can't issue them until this proxy
# is running to answer the ACME HTTP-01 challenge on port 80 above),
# deploying, running certbot, then uncommenting this block and
# redeploying. Only needed again if the cert/domain has to be re-bootstrapped
# from scratch (e.g. a new host or domain).
server {
    listen 443 ssl;
    server_name api.fastapireactboilerplate.com;

    ssl_certificate /etc/letsencrypt/live/api.fastapireactboilerplate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fastapireactboilerplate.com/privkey.pem;

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
