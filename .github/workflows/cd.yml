name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: Force backend deploy even if backend/** didn't change
        type: boolean
        default: false
      deploy_frontend:
        description: Force frontend deploy even if frontend/** didn't change
        type: boolean
        default: false

# Never let two Ansible runs race the same droplet - queue instead of
# cancelling, so a deploy that's already touching prod always finishes.
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'compose/**'
              - 'infrastructure/**'
            frontend:
              - 'frontend/**'

  test-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event.inputs.deploy_backend == 'true'
    uses: ./.github/workflows/_test-backend.yml

  test-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event.inputs.deploy_frontend == 'true'
    uses: ./.github/workflows/_test-frontend.yml

  build-push:
    needs: [changes, test-backend]
    if: |
      (needs.changes.outputs.backend == 'true' || github.event.inputs.deploy_backend == 'true') &&
      needs.test-backend.result == 'success'
    uses: ./.github/workflows/_build-push.yml
    secrets: inherit

  deploy-backend:
    needs: build-push
    if: needs.build-push.result == 'success'
    uses: ./.github/workflows/_deploy-droplet.yml
    with:
      image_tag: ${{ needs.build-push.outputs.image_tag }}
    secrets: inherit

  deploy-frontend:
    needs: [changes, test-frontend, deploy-backend]
    if: |
      always() &&
      needs.deploy-backend.result != 'failure' &&
      (needs.changes.outputs.frontend == 'true' || github.event.inputs.deploy_frontend == 'true')
    uses: ./.github/workflows/_deploy-netlify.yml
    secrets: inherit