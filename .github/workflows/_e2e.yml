name: E2E tests

on:
  workflow_call:

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download wait-for-it.sh
        run: |
          curl -o wait-for-it.sh https://raw.githubusercontent.com/vishnubob/wait-for-it/master/wait-for-it.sh
          chmod +x wait-for-it.sh

      - name: Build and start stack
        env:
          APP_ENV: TEST
        run: docker compose -f ./compose/docker-compose.yml up --build -d

      - name: Wait for API
        run: ./wait-for-it.sh localhost:8000 -t 60

      - name: Wait for Postgres
        run: |
          docker compose -f ./compose/docker-compose.yml exec -T db \
            bash -c "until pg_isready -U dbadmin; do sleep 1; done"

      - name: Run migrations
        run: |
          docker compose -f ./compose/docker-compose.yml exec -T backend \
            alembic -c app/db/migrations/alembic.ini upgrade head

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test --workers=1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f ./compose/docker-compose.yml down